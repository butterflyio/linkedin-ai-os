<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niche Research Gate</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:#f5f6f8; color:#1b1e26; }
  header { padding:14px 22px; background:#fff; border-bottom:1px solid #e3e6ec; display:flex; align-items:center; gap:12px; position:sticky; top:0; }
  header h1 { font-size:16px; margin:0; }
  #src { font-size:12px; color:#6b707b; }
  .wrap { max-width: 980px; margin: 18px auto; padding: 0 18px; }
  .controls { display:flex; gap:10px; margin: 8px 0 16px; flex-wrap: wrap; }
  button { font:inherit; border:1px solid #cfd4dd; background:#fff; border-radius:8px; padding:7px 14px; cursor:pointer; }
  button.primary { background:#0e7a45; color:#fff; border-color:#0e7a45; }
  .row { display:flex; align-items:flex-start; gap:12px; background:#fff; border:1px solid #e3e6ec; border-radius:10px; padding:12px 14px; margin-bottom:8px; }
  .row input { width:18px; height:18px; margin-top:2px; }
  .row .meta { color:#6b707b; font-size:12px; }
  .tier { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.05em; border-radius:6px; padding:2px 8px; margin-left:6px; }
  .Tier1 { background:#e6f4ea; color:#0e7a45; } .Tier2 { background:#eef3fa; color:#0f4c81; }
  .Community { background:#f4eef8; color:#6a3fd1; } .Expert { background:#fdf3e3; color:#b56b00; }
  .Index { background:#eef0f4; color:#5f636e; }
  .rec { background:#fdebed; color:#c0392b; border:1px solid #f5c6cb; border-radius:6px; font-size:11px; padding:1px 7px; margin-left:6px; }
  .via { font-size:11px; color:#6b707b; margin-top:4px; } .via b { color:#0f4c81; }
  .sum { font-size:11px; margin-top:6px; padding:3px 11px; border-radius:8px; }
  .sumtext { font-size:13px; color:#2b2f38; background:#f7f8fa; border:1px solid #eef0f4; border-radius:8px; padding:8px 10px; margin-top:6px; white-space:pre-wrap; }
  .tags { margin-top:4px; display:flex; flex-wrap:wrap; gap:6px; }
  .tag { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.03em; border-radius:999px; padding:2px 10px; }
  .legend { display:flex; flex-wrap:wrap; gap:8px; margin: 6px 0 14px; padding:10px 12px; background:#fff; border:1px solid #e3e6ec; border-radius:10px; }
  .legend .tag { cursor:pointer; }
  a { color:#0f4c81; }
  .status { font-size:13px; color:#0e7a45; min-height:18px; }
  code { background:#eef0f4; padding:1px 6px; border-radius:5px; }
</style>
</head>
<body>
<header>
  <h1>Niche Research — Manual Gate</h1>
  <span id="src">loading…</span>
  <span style="flex:1"></span>
  <span class="status" id="status"></span>
</header>
<div class="wrap">
  <div class="controls">
    <button id="recs">Use my recommended set</button>
    <button id="all">Select all</button>
    <button id="none">Clear</button>
    <button class="primary" id="save">Save approvals</button>
  </div>
  <p class="meta">⬜ tick the rows you want in the content matrix. Anything with a <span class="rec">suggested</span> tag is my pick for your pillars. Saved to <code>research/gate-approvals.json</code> and read by the pipeline.</p>
  <div id="list">loading rows…</div>
  <p class="meta">Source: <code id="fileLabel">-</code></p>
</div>
<script>
const FILE = "niche-review-2026-10-30.md";
const RECS = ["R2","R4","R6","R7","R8","R14","R15"];
// visual theme tags - color-coded so the approve/no-approve decision reflects
// what subject you are actually buying into
const TAGDEFS = [
  { label: "Agent orchestration", color: "#efe9fb", text: "#6a3fd1", keys: ["swarm","orchestr","multi-agent","minecraft","government","sequential","workflow","team of agents","coordinat"] },
  { label: "Coding agents", color: "#e2f3f7", text: "#0f8fa8", keys: ["coding agent","claude code","phpclaw","llama-server","forge","code agent","harness","verification harness"] },
  { label: "Open models & hardware", color: "#fdf3e3", text: "#b56b00", keys: ["open weight","open source","hle","rtx","gpu","qwen","local llama","distill","zed","workstation"] },
  { label: "Model releases", color: "#e8f1fe", text: "#0667d2", keys: ["gpt","openai","anthropic","opus","claude","bel","beta","astra","release","model spec"] },
  { label: "Safety & alignment", color: "#fdebed", text: "#c0392b", keys: ["safety","alignment","control","rogue","oversight","govern","regulation","policy","scores","harm","human"] },
  { label: "Enterprise trust", color: "#fdeee7", text: "#f05a22", keys: ["pentagon","bank","block","defense","military","institution","enterprise","secure" ] },
  { label: "SEO · AEO · GEO · Web3", color: "#e7f5ec", text: "#0e7a45", keys: ["seo","aeo","geo","backlink","search console","ga4","semrush","ahrefs","web3","answer engine","generative engine"] },
  { label: "Research & papers", color: "#edf1f4", text: "#546e78", keys: ["arxiv","paper","survey","analysis","field notes","report","study","evaluation","delta"] },
  { label: "Tools & launches", color: "#f4effb", text: "#9c27b0", keys: ["show hn","launch","sdk","api","mcp","terminal","gui","canvas","dashboard","browser","open source","comment","event"] },
];
function tagsFor(t) {
  const s = (t || "").toLowerCase();
  return TAGDEFS.filter(d => d.keys.some(k => s.includes(k))).slice(0, 2);
}
let DATA = [];   // [{id,title,tier,url,notes}]
let APPROVED = {};
let srcName = FILE;

async function loadReview() {
  const r = await fetch(FILE); if (!r.ok) throw new Error("can't fetch " + FILE);
  const txt = await r.text();
  const rows = [];
  const re = /^- \[ \] (R\d+)\s*\|\s*([^|]{1,90})\s*\|\s*([^|]{3,20})\s*\|\s*(\S+)(?:\s*\|\s*via:\s*([^¶]+))?\s*¶\s*(.*)$/gm;
  let m;
  while ((m = re.exec(txt)) !== null) {
    rows.push({ id: m[1], title: m[2].trim(), tier: m[3].trim(), url: m[4].trim(), via: (m[5] || "").trim(), brief: (m[6] || "").trim() });
  }
  return rows;
}
async function loadApprovals() {
  try { const r = await fetch("/api/approvals"); if (r.ok) { const d = await r.json(); APPROVED = (d.rows || d) || {}; } }
  catch (e) {}
}
function render() {
  const filter = document.body.dataset.filter || "";
  const rows = filter ? DATA.filter(d => tagsFor(d.title).some(t => t.label === filter)) : DATA;
  const el = document.getElementById("list");
  const notice = filter
    ? `<p class="meta">Showing only: <b>${filter}</b> (${rows.length} rows) · <a href="javascript:document.body.dataset.filter='';render();">clear filter</a></p>`
    : "";
  el.innerHTML = notice + rows.map(d => `
    <div class="row">
      <input type="checkbox" data-id="${d.id}" ${APPROVED[d.id] ? "checked" : ""}>
      <div>
        <div><strong>${d.id}</strong> · ${d.title}
          <span class="tier ${d.tier}">${d.tier}</span>
          ${RECS.includes(d.id) ? '<span class="rec">suggested</span>' : ""}
        </div>
        ${tagsLayout(d)}
        ${d.via ? `<div class="via">also surfaced on: <b>${d.via}</b></div>` : ""}
        ${d.brief ? `<div class="sumtext" style="display:block">${d.brief}</div>` : ""}
        <a href="${d.url}" target="_blank" rel="noopener">${d.url.replace("https://","")}</a>
        <div><button class="sum" data-id="${d.id}">read more (AI)</button></div>
        <div class="sumtext" id="sum_${d.id}" hidden></div>
      </div>
    </div>`).join("");
  document.querySelectorAll("#list input").forEach(cb => cb.addEventListener("change", () => {
    APPROVED[cb.dataset.id] = cb.checked; status("Edited - not saved yet");
  }));
  document.querySelectorAll("#list .sum").forEach(btn => btn.addEventListener("click", async () => {
    const d = DATA.find(x => x.id === btn.dataset.id);
    const box = document.getElementById("sum_" + d.id);
    if (box.hidden === false) { box.hidden = true; return; }
    if (d._summary) { box.textContent = d._summary; box.hidden = false; return; }
    btn.textContent = "loading…";
    try {
      const r = await fetch("/api/summarize", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ title: d.title, url: d.url }) });
      const j = await r.json();
      d._summary = (j.summary || "(no summary)") + (j.key_points && j.key_points.length ? "\n\n• " + j.key_points.join("\n• ") : "") + (j.relevance ? "\n\nWhy it matters: " + j.relevance : "");
      box.textContent = d._summary; box.hidden = false; btn.textContent = "read summary";
    } catch (e) {
      box.textContent = "summary unavailable: " + e.message; box.hidden = false; btn.textContent = "read summary";
    }
  }));
}
function tagsLayout(d) {
  const tags = tagsFor(d.title);
  if (!tags.length) return "";
  return `<div class="tags">${tags.map(t => `<span class="tag" style="background:${t.color};color:${t.text}">${t.label}</span>`).join("")}</div>`;
}
function renderLegend() {
  const el = document.createElement("div");
  el.className = "legend";
  el.innerHTML = TAGDEFS.map(t => `<span class="tag" style="background:${t.color};color:${t.text}" data-tag="${t.label}">${t.label}</span>`).join("") + "<span style='color:#6b707b'>click a tag to filter</span>";
  document.querySelector(".controls").after(el);
  el.addEventListener("click", (e) => {
    const tag = e.target.dataset && e.target.dataset.tag;
    if (!tag) return;
    const only = document.body.dataset.filter;
    const next = only === tag ? "" : tag;
    document.body.dataset.filter = next;
    render();
  });
}
function status(s) { document.getElementById("status").textContent = s; }
const setAll = (v) => { DATA.forEach(d => APPROVED[d.id] = v); render(); status(v ? "All selected" : "Cleared - not saved"); };

document.getElementById("all").onclick = () => setAll(true);
document.getElementById("none").onclick = () => setAll(false);
document.getElementById("recs").onclick = () => { setAll(false); RECS.forEach(r => APPROVED[r] = true); render(); status("Recommended set applied - not saved"); };
document.getElementById("save").onclick = async () => {
  const rows = DATA.filter(d => APPROVED[d.id]).map(d => ({ id: d.id, title: d.title, tier: d.tier, url: d.url }));
  const payload = { source: FILE, savedAt: new Date().toISOString(), rows, approvedIds: rows.map(r => r.id) };
  const r = await fetch("/api/save", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
  if (r.ok) { status(`Saved ${rows.length} approved rows → research/gate-approvals.json ✓`); }
  else { status("Save failed"); }
};

(async function init() {
  try {
    const [rows, ] = await Promise.all([loadReview(), loadApprovals()]);
    DATA = rows;
    srcName = FILE;
    document.getElementById("src").textContent = "source: " + srcName;
    document.getElementById("fileLabel").textContent = "research/" + srcName;
    renderLegend(); render(); status(DATA.length + " rows · " + Object.values(APPROVED).filter(Boolean).length + " approved (saved copy)");
  } catch (e) {
    document.getElementById("list").innerHTML = "Couldn't load the review. Is the local server running? (tools/web.py)";
    document.getElementById("status").textContent = e.message;
  }
})();
</script>
</body>
</html>
